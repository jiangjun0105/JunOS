<!doctype html><meta charset="utf-8"><title>favicon options</title>
<style>
body{margin:0;padding:28px;background:#0b1116;color:#d6e4ea;font:13px/1.4 ui-monospace,monospace}
.row{display:grid;grid-template-columns:130px 260px 260px 90px;gap:22px;align-items:center;margin-bottom:22px}
.tab{display:flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-radius:8px 8px 0 0;font:13px system-ui}
.dark{background:#35363a;color:#e8eaed}.light{background:#fff;color:#202124}
.tab img{width:16px;height:16px}.big{width:64px;height:64px}h1{font-size:15px;color:#ffb23f;margin:0 0 20px}
</style>
<h1>FAVICON OPTIONS · real 16px tab · 64px</h1>
<div id="r"></div>
<script>
const opts=[['1 reticle','reticle.svg'],['2 J + lock frame','j-reticle.svg'],['3 golden gate','tower.svg'],['4 robot visor','visor.svg'],['current gear','/icons/gear.png']];
r.innerHTML=opts.map(([n,f])=>`<div class=row><b>${n}</b><div class="tab dark"><img src="${f}">Jun Jiang · JunOS</div><div class="tab light"><img src="${f}">Jun Jiang · JunOS</div><img class=big src="${f}"></div>`).join('');
</script>
