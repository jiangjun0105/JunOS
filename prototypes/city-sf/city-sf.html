<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JunOS · San Francisco</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@500;600&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
  /* --accent / --cyan are also read by city-config.js for the 3D layer */
  :root { --bg:#02060a; --accent:#ffb23f; --accent-rgb:255,178,63; --cyan:#19e1ff; --cyan-rgb:25,225,255; --halo:0 0 3px var(--bg), 0 0 6px var(--bg); }
  body { margin:0; background:var(--bg); overflow:hidden; }
  #c3 { position:fixed; inset:0; overflow:hidden; }
  .hud { position:absolute; z-index:3; font-family:'IBM Plex Mono',monospace; color:var(--cyan); text-shadow:var(--halo); }
  #st { left:16px; top:12px; font-size:11px; font-weight:600; letter-spacing:.06em; }
  #hint { left:16px; bottom:12px; font-size:10px; font-weight:500; letter-spacing:.08em; opacity:.7; }
  #home { right:16px; top:10px; font-size:10px; font-weight:600; letter-spacing:.1em; background:rgba(2,10,14,.8); border:1px solid rgba(var(--cyan-rgb),.5); padding:5px 10px; cursor:pointer; text-shadow:none; }
  #lay, #leads { position:absolute; inset:0; z-index:2; pointer-events:none; width:100%; height:100%; }
  #leads .ld { stroke:rgba(var(--accent-rgb),.65); stroke-width:1; fill:none; }

  .ic3 { all:unset; position:absolute; left:0; top:0; width:124px; height:92px; justify-content:flex-end; display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer; pointer-events:auto; }
  .ic3 .rg { position:relative; width:46px; height:46px; display:grid; place-items:center; border-radius:50%; background:radial-gradient(circle, rgba(4,10,14,.85) 60%, transparent 62%); transition:all .2s; }
  .ic3 .fr { position:absolute; inset:0; width:100%; height:100%; overflow:visible; stroke:var(--accent); fill:none; transition:filter .2s; }
  .ic3 svg.g { width:20px; height:20px; stroke:var(--accent); fill:none; stroke-width:1.6; position:relative; }
  .ic3:is(:hover, :focus-visible, .on) .rg { background:radial-gradient(circle, var(--accent) 60%, transparent 62%); }
  .ic3:is(:hover, :focus-visible, .on) svg.g { stroke:var(--bg); }
  .ic3:is(:hover, :focus-visible, .on) .fr { filter:drop-shadow(0 0 5px rgba(var(--accent-rgb),.9)); }
  .ic3 b { font:600 10.5px 'Exo 2','IBM Plex Mono',sans-serif; letter-spacing:.1em; color:var(--accent); text-shadow:0 0 2px var(--bg), 0 0 6px var(--bg), 0 0 10px rgba(var(--accent-rgb),.45); text-transform:uppercase; white-space:nowrap; }
  .ic3 i { font:500 8.5px 'IBM Plex Mono',monospace; font-style:normal; letter-spacing:.08em; color:rgba(255,232,200,.7); white-space:nowrap; text-shadow:0 0 2px var(--bg), 0 0 5px var(--bg); }

  .ic3 { transform-origin:50% 100%; transition:opacity .4s; }
  .ic3.away, .ld.away { opacity:0; pointer-events:none; }

  /* app window: hidden → .peek (hover card, bottom corner) → .open (most of the screen). JS sets left/top/width/height */
  .w3 { position:absolute; z-index:4; display:flex; flex-direction:column; overflow:hidden; background:rgba(9,14,17,.94); border:1px solid rgba(var(--cyan-rgb),.35);
        box-shadow:0 0 40px rgba(var(--cyan-rgb),.2); backdrop-filter:blur(6px); opacity:0; visibility:hidden; pointer-events:none;
        transition:opacity .2s, visibility .2s, left .55s cubic-bezier(.2,.9,.3,1), top .55s cubic-bezier(.2,.9,.3,1), width .55s cubic-bezier(.2,.9,.3,1), height .55s cubic-bezier(.2,.9,.3,1); }
  .w3.peek, .w3.open { opacity:1; visibility:visible; }
  .w3.open { pointer-events:auto; }
  .w3t { flex:none; background:var(--cyan); color:var(--bg); font:600 11px 'Exo 2','IBM Plex Mono',sans-serif; letter-spacing:.14em; padding:7px 12px; display:flex; justify-content:space-between; }
  .w3x { all:unset; cursor:pointer; padding:0 4px; visibility:hidden; } .open .w3x { visibility:visible; }
  .w3b { flex:1; overflow:auto; padding:16px 18px; color:#b4c4cb; font:13px/1.65 'IBM Plex Sans',sans-serif; }
  .open .w3b { padding:28px 36px; font-size:15px; animation:w3in .5s .2s both; }
  @keyframes w3in { from { opacity:0; transform:translateY(8px) } }
  .w3b h3 { margin:0 0 12px; font:600 30px 'Exo 2','IBM Plex Sans',sans-serif; color:#eafcff; max-width:24ch; }
  .w3b h4 { margin:0 0 4px; font:600 17px 'Exo 2','IBM Plex Sans',sans-serif; color:#eafcff; }
  .w3b p { margin:0 0 10px; max-width:62ch; }
  .w3b .k { font:500 10px 'IBM Plex Mono',monospace; letter-spacing:.12em; color:var(--cyan); margin-bottom:10px; }
  .w3b .cta { font:600 10px 'IBM Plex Mono',monospace; letter-spacing:.12em; color:var(--accent); }
  .w3b .ph { margin-top:24px; padding:40px; border:1px dashed rgba(var(--cyan-rgb),.3); color:rgba(var(--cyan-rgb),.6); font:500 11px 'IBM Plex Mono',monospace; letter-spacing:.1em; text-align:center; text-transform:uppercase; }
</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/" } }</script>
<script type="module" src="/files/city-main.js"></script>
</head><body>
<div id="c3">
  <svg id="leads"></svg><div id="lay"></div>
  <div class="hud" id="st">LOADING ELEVATION + OPENSTREETMAP …</div>
  <div class="hud" id="hint">REAL TERRAIN (AWS, 1.6× HEIGHT) + OPENSTREETMAP · DRAG ORBIT · SCROLL ZOOM · RIGHT-DRAG PAN · CLICK AN ICON</div>
  <button class="hud" id="home">⌂ OVERVIEW</button>
  <div id="win3" class="w3"><div class="w3t"><span id="w3title"></span><button class="w3x" id="w3x" aria-label="Close">×</button></div><div class="w3b" id="w3body"></div></div>
</div>
</body></html>
