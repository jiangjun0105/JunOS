<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Article reader — type proposals</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  /* tokens copied from src/styles/theme.css */
  :root {
    --bg: 2 6 10; --surface: 9 14 17; --surface-2: 15 26 32;
    --ink: 214 228 234; --muted: 138 160 170; --border: 36 88 102;
    --accent: 255 178 63; --heading: 234 252 255; --cyan: 25 225 255;
    --chrome: 'Exo 2', sans-serif; --body: 'IBM Plex Sans', sans-serif; --mono: 'IBM Plex Mono', monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: rgb(var(--bg)); color: rgb(var(--ink)); font-family: var(--body); -webkit-font-smoothing: antialiased; }
  .switch { display: flex; gap: 6px; justify-content: center; padding: 18px; }
  .switch button { background: none; border: 1px solid rgb(var(--border)); color: rgb(var(--muted)); padding: 6px 14px;
    font: 600 13px var(--chrome); letter-spacing: .12em; text-transform: uppercase; cursor: pointer; }
  .switch button.on { color: rgb(var(--accent)); border-color: rgb(var(--accent)); background: rgb(var(--accent) / .08); }
  .note { text-align: center; color: rgb(var(--muted)); font-size: 14px; max-width: 760px; margin: 0 auto 16px; min-height: 2.6em; }

  /* the OS window frame */
  .win { width: 820px; max-width: calc(100vw - 32px); margin: 0 auto 60px; background: rgb(var(--surface) / .9);
    border: 1px solid rgb(var(--cyan) / .5); box-shadow: 0 0 40px rgb(var(--cyan) / .2); }
  .bar { display: flex; justify-content: space-between; padding: 7px 12px; border-bottom: 1px solid rgb(var(--border));
    font: 600 12px var(--chrome); letter-spacing: .18em; color: rgb(var(--cyan)); text-transform: uppercase; }
  .body { padding: 20px 24px; height: 680px; overflow: auto; }
  .body::-webkit-scrollbar { width: 6px; } .body::-webkit-scrollbar-thumb { background: rgb(var(--border)); }
  figure { margin: 0; } img { display: block; width: 100%; }
  .fig-ph { height: 180px; background:
      repeating-linear-gradient(0deg, transparent 0 23px, rgb(var(--cyan) / .08) 23px 24px),
      repeating-linear-gradient(90deg, transparent 0 23px, rgb(var(--cyan) / .08) 23px 24px), rgb(var(--surface-2)); }

  /* ===================== 0 · CURRENT (what ships today) ===================== */
  .v0 .head { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 2px dashed rgb(var(--border) / .25); }
  .v0 .meta { font: 600 13px var(--chrome); text-transform: uppercase; letter-spacing: .03em; color: rgb(var(--muted)); }
  .v0 .tags span { border-radius: 999px; border: 1px solid rgb(var(--border) / .4); background: rgb(var(--surface-2) / .6); padding: 2px 8px; font-size: 11px; color: rgb(var(--muted)); margin-left: 4px; }
  .v0 h1 { font: 700 22px var(--body); margin: 4px 0 8px; }
  .v0 h2 { font: 700 20px var(--body); margin: 20px 0 8px; }
  .v0 h3 { font: 700 18px var(--body); margin: 16px 0 6px; }
  .v0 p, .v0 li { font-size: 18px; line-height: 1.625; }
  .v0 p { margin: 10px 0; }
  .v0 .lead { font-size: 15px; font-weight: 500; }
  .v0 ul, .v0 ol { padding-left: 20px; } .v0 li::marker { color: rgb(var(--accent)); }
  .v0 a { color: rgb(var(--accent)); text-decoration: underline; }
  .v0 blockquote { margin: 12px 0; border-left: 3px solid rgb(var(--accent) / .5); border-radius: 0 6px 6px 0; background: rgb(var(--surface-2) / .4); padding: 6px 12px; font-style: italic; color: rgb(var(--muted)); }
  .v0 hr { border: 0; border-top: 2px dashed rgb(var(--border) / .3); margin: 20px 0; }
  .v0 code { border: 1px solid rgb(var(--border) / .4); background: rgb(var(--surface-2) / .6); padding: 1px 6px; font: 13px var(--mono); border-radius: 2px; }
  .v0 pre { border: 2px solid rgb(var(--border)); background: rgb(var(--surface-2) / .5); padding: 12px; font: 13px/1.6 var(--mono); overflow: auto; }
  .v0 pre code { border: 0; background: none; padding: 0; }
  .v0 figure .fig-ph, .v0 figure img { border: 2px solid rgb(var(--border)); }
  .v0 figcaption { display: none; }

  /* ============ shared HUD skin for 1 & 2 (they differ in body font + density) ============ */
  .hud { max-width: 68ch; margin: 0 auto; }
  .hud .head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;
    padding: 6px 0; margin-bottom: 18px; border-top: 1px solid rgb(var(--border)); border-bottom: 1px solid rgb(var(--border)); position: relative; }
  .hud .head::before, .hud .head::after { content: ''; position: absolute; top: -4px; width: 1px; height: calc(100% + 8px); background: rgb(var(--cyan) / .7); }
  .hud .head::before { left: 0; } .hud .head::after { right: 0; }
  .hud .meta { font: 500 12px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: rgb(var(--muted)); padding-left: 10px; }
  .hud .meta b { color: rgb(var(--cyan)); font-weight: 600; }
  .hud .tags { padding-right: 10px; }
  .hud .tags span { font: 500 11px var(--mono); color: rgb(var(--cyan)); border: 1px solid rgb(var(--cyan) / .35); padding: 1px 6px; margin-left: 4px; }
  .hud .tags span::before { content: '#'; opacity: .55; }
  .hud h1 { font: 600 30px/1.2 var(--chrome); letter-spacing: .01em; color: rgb(var(--heading)); text-shadow: 0 0 14px rgb(var(--cyan) / .25); margin: 0 0 8px; }
  .hud .lead { color: rgb(var(--muted)); margin: 0 0 22px; }
  .hud h2 { display: flex; align-items: baseline; gap: 10px; font: 600 19px var(--chrome); letter-spacing: .02em; color: rgb(var(--heading)); margin: 34px 0 12px; }
  .hud h2::before { content: '// ' attr(data-n); font: 500 12px var(--mono); color: rgb(var(--accent)); letter-spacing: .05em; }
  .hud h2::after { content: ''; flex: 1; height: 1px; align-self: center; background: linear-gradient(90deg, rgb(var(--cyan) / .45), transparent); }
  .hud h3 { font: 600 13px var(--chrome); letter-spacing: .16em; text-transform: uppercase; color: rgb(var(--cyan)); margin: 24px 0 8px; }
  .hud p { margin: 0 0 14px; }
  .hud strong { color: rgb(var(--heading)); font-weight: 600; }
  .hud a { color: rgb(var(--accent)); text-decoration: underline; text-decoration-color: rgb(var(--accent) / .4); text-underline-offset: 3px; transition: text-shadow .15s, text-decoration-color .15s; }
  .hud a:hover { text-decoration-color: rgb(var(--accent)); text-shadow: 0 0 8px rgb(var(--accent) / .6); }
  .hud ul, .hud ol { list-style: none; padding: 0; margin: 0 0 14px; }
  .hud li { position: relative; padding-left: 26px; margin-bottom: 6px; }
  .hud ul li::before { content: '▸'; position: absolute; left: 6px; color: rgb(var(--accent)); }
  .hud ol { counter-reset: n; } .hud ol li { counter-increment: n; }
  .hud ol li::before { content: counter(n, decimal-leading-zero); position: absolute; left: 0; top: .2em; font: 500 12px var(--mono); color: rgb(var(--accent)); }
  .hud blockquote { margin: 18px 0; padding: 8px 14px; border-left: 2px solid rgb(var(--accent)); background: linear-gradient(90deg, rgb(var(--accent) / .07), transparent 70%); color: rgb(var(--ink)); }
  .hud blockquote::before { content: 'NOTE ▸'; display: block; font: 600 11px var(--mono); letter-spacing: .14em; color: rgb(var(--accent)); margin-bottom: 4px; }
  .hud blockquote p { margin: 0; }
  .hud hr { border: 0; height: 9px; margin: 30px 0; background:
      linear-gradient(rgb(var(--cyan) / .7), rgb(var(--cyan) / .7)) center / 1px 9px no-repeat,
      linear-gradient(90deg, transparent, rgb(var(--border)) 20%, rgb(var(--border)) 80%, transparent) center / 100% 1px no-repeat; }
  .hud code { font: 500 .86em var(--mono); color: rgb(var(--cyan)); background: rgb(var(--cyan) / .07); padding: 1px 5px; }
  .hud pre { margin: 18px 0; border: 1px solid rgb(var(--border)); background: rgb(var(--surface-2) / .6); font: 13px/1.6 var(--mono); }
  .hud pre::before { content: attr(data-lang) '  ·  EXEC'; display: block; padding: 4px 10px; border-bottom: 1px solid rgb(var(--border)); font: 600 10.5px var(--mono); letter-spacing: .14em; color: rgb(var(--muted)); }
  .hud pre code { display: block; padding: 10px 12px; background: none; color: rgb(var(--ink)); overflow: auto; }
  /* corner-bracket frame, the reticle corners from the city icons */
  .hud figure { position: relative; margin: 22px 0; padding: 6px; }
  .hud figure::before, .hud figure::after { content: ''; position: absolute; inset: 0; pointer-events: none; border: 1px solid rgb(var(--accent) / .8);
    -webkit-mask: conic-gradient(at 14px 14px, transparent 75%, #000 0) 0 0 / calc(100% - 14px) calc(100% - 14px); }
  .hud figcaption { margin-top: 8px; font: 500 11.5px var(--mono); letter-spacing: .06em; color: rgb(var(--muted)); }
  .hud figcaption b { color: rgb(var(--accent)); font-weight: 600; }

  /* 1 · RESTRAINED — Plex Sans body, HUD only on the frame */
  .v1 { font: 400 16.5px/1.72 var(--body); color: rgb(var(--ink) / .92); }
  .v1 .lead { font-size: 17px; }

  /* 2 · FULL HUD — mono body, tighter measure, glowing ink */
  .v2 { max-width: 64ch; font: 400 14.5px/1.75 var(--mono); color: rgb(var(--ink) / .9); }
  .v2 h1 { text-transform: uppercase; letter-spacing: .05em; font-size: 26px; }
  .v2 h2 { text-transform: uppercase; letter-spacing: .08em; font-size: 16px; }
  .v2 p::first-line { color: rgb(var(--heading)); }
  .v2 strong { color: rgb(var(--accent)); font-weight: 600; }

  /* 3 · SPEC SHEET — sans body, headings in a left gutter like a datasheet */
  .v3 { max-width: none; font: 400 16px/1.7 var(--body); color: rgb(var(--ink) / .92); }
  .v3 .flow { display: grid; grid-template-columns: 150px minmax(0, 62ch); column-gap: 24px; }
  .v3 .flow > * { grid-column: 2; }
  .v3 .flow > h2 { grid-column: 1; grid-row: span 3; display: block; margin: 4px 0 0; font-size: 13px; letter-spacing: .1em; text-transform: uppercase;
    color: rgb(var(--cyan)); text-align: right; border-right: 1px solid rgb(var(--cyan) / .4); padding-right: 12px; align-self: start; position: sticky; top: 0; }
  .v3 .flow > h2::before { display: block; margin-bottom: 4px; }
  .v3 .flow > h2::after { display: none; }
  .v3 .flow > h2 ~ h2 { margin-top: 30px; }
  .v3 .flow > hr { grid-column: 1 / -1; }
</style>
</head>
<body>
<div class="switch">
  <button data-v="0">0 · Current</button>
  <button data-v="1" class="on">1 · Restrained</button>
  <button data-v="2">2 · Full HUD</button>
  <button data-v="3">3 · Spec sheet</button>
</div>
<p class="note" id="note"></p>

<div class="win">
  <div class="bar"><span>◇ Thoughts / structure-over-weights</span><span>— ▢ ✕</span></div>
  <div class="body"><div id="art"></div></div>
</div>

<template id="tpl">
  <header class="head">
    <div class="meta"><b>LOG</b> 2026-05-20 · ESSAY · 6 MIN</div>
    <div class="tags"><span>brain</span><span>snn</span><span>connectome</span></div>
  </header>
  <h1>Structure Over Weights</h1>
  <p class="lead">What a simulated fly brain says about how brains should be trained.</p>
  <div class="flow">
    <h2 data-n="01">The observation I can't shake</h2>
    <p>More and more biological-brain work points the same way. In 2024 Philip Shiu and colleagues built a leaky integrate-and-fire model of the entire fruit-fly brain — more than 125,000 neurons, 50 million synapses — from the <a href="#">FlyWire connectome</a>. In March 2026 Eon Systems put that kind of model into a physically simulated body and the fly moved.</p>
    <p>What strikes me is how little was needed. The model has <strong>no trained parameters</strong>. It uses the graph of who connects to whom, a weight per connection equal to the synapse count, an excitatory/inhibitory map, and a <code>LIF</code> neuron.</p>
    <blockquote><p>Weights, in other words, are not where the intelligence lives. Structure is.</p></blockquote>
    <figure><div class="fig-ph"></div><figcaption><b>FIG.1</b> · FlyWire connectome, 125k neurons, soma positions</figcaption></figure>
    <h2 data-n="02">What that means for training</h2>
    <p>Mainstream deep learning does it backwards: hand-design a fixed architecture, then spend all the effort training the parameters inside it. If we ever want to train a real brain, I think two things have to be true:</p>
    <ol>
      <li><strong>The brain is tightly coupled to its body.</strong> The body it controls determines the structure it evolves into.</li>
      <li><strong>Training explores structure.</strong> Search over the architecture, not just the weights.</li>
    </ol>
    <h3>A sketch of the loop</h3>
    <pre data-lang="PY"><code>for gen in range(G):
    net = grow(net, surplus=1.5)
    net = prune(net, body.score)</code></pre>
    <hr />
    <h2 data-n="03">Fact-check notes</h2>
    <ul>
      <li>Shuffled weights on the real graph fired in only 1 of 100 runs versus 100 of 100.</li>
      <li>So weights matter — but they are synapse counts, i.e. structure measured a second way.</li>
    </ul>
  </div>
</template>

<script>
  const notes = {
    0: 'What ships today: bold Plex Sans headings, 18px body, dashed rules, round pills, italic quote.',
    1: 'Plex Sans body kept for long reads (16.5px, 68ch). HUD lives on the frame: Exo 2 headings, // 01 markers, mono meta line, # chips, ▸ lists, NOTE callout, tick rule, reticle-corner figure.',
    2: 'Same frame, but the body is Plex Mono 14.5px: reads like a terminal log. Most "robot", hardest on long essays.',
    3: 'Option 1 type, with section headings pulled into a left gutter that scrolls with the text like a datasheet. Needs a wide window; collapses to 1 on narrow.',
  }
  const art = document.getElementById('art'), tpl = document.getElementById('tpl')
  function show(v) {
    art.className = v === '0' ? 'v0' : `hud v${v}`
    art.replaceChildren(tpl.content.cloneNode(true))
    document.getElementById('note').textContent = notes[v]
    document.querySelectorAll('.switch button').forEach((b) => b.classList.toggle('on', b.dataset.v === v))
  }
  document.querySelectorAll('.switch button').forEach((b) => b.addEventListener('click', () => show(b.dataset.v)))
  show(new URLSearchParams(location.search).get('v') ?? '1')
</script>
</body>
</html>
